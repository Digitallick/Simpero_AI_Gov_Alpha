name: Deploy

# Manual pipeline: CI reuse -> image build/push -> optional gated Terraform
# plan/apply -> SSH deploy. Which commit deploys is chosen via the native
# "Use workflow from" branch/tag selector (no custom `ref` input) — every job
# below references github.sha directly, which is safe because a
# workflow_call'd job (the `ci` job) shares the caller's github context, so
# `ci`'s github.sha already equals whatever ref was picked in that selector.
# See docs/plans/do-droplet-deployment.md §1/§4 for the full reasoning.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        options:
          - staging
          - production
        default: staging
      run_terraform:
        description: "Run terraform-plan/terraform-apply (provision/update infra)"
        type: boolean
        default: false

# Per-environment group — prevents two overlapping dispatches (or one
# double-click) against the *same* environment from racing either Terraform
# or `docker compose up -d` against the same droplet. Per-environment (not
# one blanket group) so an unrelated staging deploy isn't needlessly
# serialized behind an in-flight production one — different state files,
# different droplets, no shared resource to protect. Not cancel-in-progress:
# a half-applied Terraform run or a half-restarted compose stack should
# finish, not be killed mid-way.
concurrency:
  group: deploy-${{ github.workflow }}-${{ inputs.environment }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  docker-publish:
    name: Build + push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase image names. github.repository_owner for this
      # repo is "Digitallick" (capital D) — must be lowercased explicitly,
      # not just interpolated. Must match the hardcoded lowercase owner in
      # docker-compose.prod.yml.
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/simpero-ai-gov-alpha" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  terraform-plan:
    name: Terraform plan
    needs: docker-publish
    if: ${{ inputs.run_terraform }}
    runs-on: ubuntu-latest
    # Ungated "-plan" Environment, not the gated one — terraform-plan needs
    # environment-specific credentials (the Spaces key, to read/lock the
    # right state file) while needing to stay reviewable *before* approval,
    # which is the whole point of a plan step. Must use the object `name:`
    # form — the string shorthand doesn't reliably resolve a dynamic value
    # here. See docs/plans/do-droplet-deployment.md §1.
    environment:
      name: ${{ inputs.environment }}-plan
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_do_token: ${{ secrets.TF_VAR_do_token }}
      TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_ssh_public_key }}
      TF_VAR_environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: terraform init
        run: terraform init -backend-config=backend-${{ inputs.environment }}.hcl

      - name: terraform plan
        run: terraform plan -var-file=${{ inputs.environment }}.tfvars -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: terraform/tfplan

  terraform-apply:
    name: Terraform apply
    needs: terraform-plan
    if: ${{ inputs.run_terraform }}
    runs-on: ubuntu-latest
    # The gated Environment (Vansh as required reviewer) — object `name:`
    # form, same reasoning as terraform-plan above.
    environment:
      name: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: terraform
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_ACCESS_KEY }}
      TF_VAR_do_token: ${{ secrets.TF_VAR_do_token }}
      TF_VAR_ssh_public_key: ${{ secrets.TF_VAR_ssh_public_key }}
      TF_VAR_environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: terraform

      # Re-init needed again in this job — fresh runner, no state from the
      # terraform-plan job carries over except the downloaded plan file.
      - name: terraform init
        run: terraform init -backend-config=backend-${{ inputs.environment }}.hcl

      # Applies the exact downloaded plan — never a fresh one — so what got
      # approved via this environment's gate is exactly what runs.
      - name: terraform apply
        run: terraform apply tfplan

  deploy:
    name: Deploy to droplet
    needs: [docker-publish, terraform-apply]
    # always() is load-bearing: without it, GH implicitly ANDs in success(),
    # which would block this job whenever terraform-apply is skipped (the
    # routine run_terraform=false case).
    #
    # Checks inputs.run_terraform directly rather than inferring intent from
    # terraform-apply's result — terraform-apply shows 'skipped' for two
    # different reasons that look identical from here: run_terraform was
    # false (fine), or terraform-plan actually FAILED, which cascades
    # terraform-apply to 'skipped' too (its own `if` has no always(), so it
    # inherits the implicit success()-of-needs gate). Tolerating any
    # 'skipped' result unconditionally would let deploy proceed after a
    # failed terraform-plan — exactly the "one job breaks, workflow should
    # stop" case this must not allow. See docs/plans/do-droplet-deployment.md §4.
    if: ${{ always() && needs.docker-publish.result == 'success' && (inputs.run_terraform == false || needs.terraform-apply.result == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    # packages: read — GITHUB_TOKEN needs this to authenticate the droplet's
    # pull below. No GHCR_PAT secret, no bot account, no GitHub App: GHCR
    # does NOT accept GitHub App installation tokens (a confirmed, current
    # platform limitation — docker login "succeeds" but pull is denied), but
    # it does accept the workflow's own GITHUB_TOKEN, same as docker-publish
    # already uses to push. Minted fresh for this job, used immediately in
    # the same SSH script below — well within its validity window.
    permissions:
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Copy compose file + Caddyfile to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: "/opt/simpero"

      # .env is generated here from this environment's GitHub Environment
      # secrets, not hand-maintained on the droplet — deliberate reversal of
      # the original plan (see docs/plans/do-droplet-deployment.md §1 history
      # and docs/PENDING_ON_VANSH.md). Overwritten on every deploy, so these
      # secrets are now the single source of truth, not the file on disk.
      # Quoted heredoc ('EOF') so secret values are written literally — no
      # shell expansion of $, backticks, etc. inside them.
      - name: Write .env from GitHub secrets
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          script: |
            cat > /opt/simpero/.env <<'SIMPERO_ENV_EOF'
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            ALEMBIC_DATABASE_URL=${{ secrets.ALEMBIC_DATABASE_URL }}
            CLERK_SECRET_KEY=${{ secrets.CLERK_SECRET_KEY }}
            CLERK_JWKS_URL=${{ secrets.CLERK_JWKS_URL }}
            VALKEY_URL=${{ secrets.VALKEY_URL }}
            ENVIRONMENT=${{ secrets.ENVIRONMENT }}
            CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}
            SIMPERO_PLATFORM_ORG_ID=${{ secrets.SIMPERO_PLATFORM_ORG_ID }}
            APP_BASE_URL=${{ secrets.APP_BASE_URL }}
            PARSER_SPACES_BUCKET=${{ secrets.PARSER_SPACES_BUCKET }}
            PARSER_SPACES_REGION=${{ secrets.PARSER_SPACES_REGION }}
            PARSER_SPACES_ENDPOINT_URL=${{ secrets.PARSER_SPACES_ENDPOINT_URL }}
            PARSER_SPACES_ACCESS_KEY_ID=${{ secrets.PARSER_SPACES_ACCESS_KEY_ID }}
            PARSER_SPACES_SECRET_ACCESS_KEY=${{ secrets.PARSER_SPACES_SECRET_ACCESS_KEY }}
            DD_APP_PASSWORD=${{ secrets.DD_APP_PASSWORD }}
            BACKEND_HOSTNAME=${{ secrets.BACKEND_HOSTNAME }}
            PGBOUNCER_DB_HOST=${{ secrets.PGBOUNCER_DB_HOST }}
            PGBOUNCER_DB_PORT=${{ secrets.PGBOUNCER_DB_PORT }}
            PGBOUNCER_DB_NAME=${{ secrets.PGBOUNCER_DB_NAME }}
            SIMPERO_ENV_EOF
            chmod 600 /opt/simpero/.env

      - name: Pull, migrate, restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/simpero
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml pull
            IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml run --rm app alembic upgrade head
            IMAGE_TAG=${{ github.sha }} docker compose -f docker-compose.prod.yml up -d

      # From the runner, not over SSH (per plan). Plain HTTP against Caddy on
      # port 80, following redirects: the app/pgbouncer services deliberately
      # publish no host port in prod (only Caddy does), so this is the only
      # externally reachable path. Before this droplet's .env has
      # BACKEND_HOSTNAME set and DNS points at the droplet (plan §5 items
      # 9-10), Caddy has no valid site/cert to serve and this step is
      # *expected* to fail even though the deploy itself succeeded — not a
      # bug in this workflow, a known first-run ordering gap in the plan.
      # health.router is mounted under API_PREFIX ("/api") in app/main.py —
      # not at the bare paths. Every route in this app lives under /api/*.
      - name: Health check
        run: |
          for path in /api/health /api/health/db /api/health/queue; do
            curl --fail -L --retry 5 --retry-delay 5 "http://${{ secrets.DROPLET_HOST }}${path}"
          done
