      - {attribute: revenueUsd, value: 18903}
    derived: {attribute: ebitdaMarginPct, value: 0.118}
    expected: holds
    note: "2233 / 18903 = 11.81%, rounds to stated 11.8%"

  # --- Period-over-period growth, cited as explicit assumptions (p.12) ----
  - id: r17
    rule: revenue_growth_matches_stated_assumption
    period: {year: 2019, kind: P, period_label: "2019F vs 2018F"}
    operands:
      - {attribute: revenueUsd, value: 17146, period_label: "2018F"}
      - {attribute: revenueUsd, value: 18003, period_label: "2019F"}
    derived: {attribute: revenueGrowthPct, value: 0.05}
    expected: holds
    note: >
      18003 / 17146 - 1 = 4.998%, matches the text's stated assumption
      ("Revenue in 2019 and 2020 assumes 5% growth over prior year levels").
  - id: r18
    rule: revenue_growth_matches_stated_assumption
    period: {year: 2020, kind: P, period_label: "2020F vs 2019F"}
    operands:
      - {attribute: revenueUsd, value: 18003, period_label: "2019F"}
      - {attribute: revenueUsd, value: 18903, period_label: "2020F"}
    derived: {attribute: revenueGrowthPct, value: 0.05}
    expected: holds
    note: "18903 / 18003 - 1 = 4.999%, matches the stated 5% assumption."
  - id: r19
    rule: opex_growth_matches_stated_assumption
    period: {year: 2019, kind: P, period_label: "2019F vs 2018F"}
    operands:
      - {attribute: operatingCostsUsd, value: 1672, period_label: "2018F"}
      - {attribute: operatingCostsUsd, value: 1723, period_label: "2019F"}
    derived: {attribute: opexGrowthPct, value: 0.03}
    expected: holds
    note: >
      1723 / 1672 - 1 = 3.05%, close to the text's stated "3% increases
      over prior year levels" -- 0.05pp off, consistent with rounding the
      underlying figures to the nearest $1K before printing.
  - id: r20
    rule: opex_growth_matches_stated_assumption
    period: {year: 2020, kind: P, period_label: "2020F vs 2019F"}
    operands:
      - {attribute: operatingCostsUsd, value: 1723, period_label: "2019F"}
      - {attribute: operatingCostsUsd, value: 1774, period_label: "2020F"}
    derived: {attribute: opexGrowthPct, value: 0.03}
    expected: holds
    note: "1774 / 1723 - 1 = 2.96%, close to the stated 3% (rounding)."

  # --- Narrative callouts (p.10), secured-contract coverage ----------------
  - id: r21
    rule: secured_revenue_pct_of_2018_budget
    period: {year: 2018, kind: P, period_label: "2018F"}
    operands:
      - {attribute: securedRevenueUsd, value: 8900, unit_note: "stated as $8.9 million"}
      - {attribute: revenueUsd, value: 17146}
    derived: {attribute: securedRevenuePct, value: 0.52}
    expected: holds
    note: >
      8900 / 17146 = 51.9%, rounds to the stated "52%" ("The Companies
      began 2018 with $8.9 million (52%) of its fiscal revenue budget
      secured by firm contracts").
  - id: r22
    rule: secured_gross_margin_pct
    period: {year: 2018, kind: P, period_label: "2018F secured contracts"}
    operands:
      - {attribute: securedGrossMarginUsd, value: 2000, unit_note: "stated as $2.0 million"}
      - {attribute: securedRevenueUsd, value: 8900, unit_note: "stated as $8.9 million"}
    derived: {attribute: securedGrossMarginPct, value: 0.222}
    expected: uncertain
    note: >
      2000 / 8900 = 22.47%, vs the text's stated "22.2%" -- a 0.27pp gap
      ("Fiscal 2018 secured contracts are forecast to produce gross margins
      of 22.2% or $2.0 million"). Both $8.9M and $2.0M are themselves
      rounded to one decimal in the source text; the true unrounded
      operands aren't recoverable from this Memorandum alone, so this
      could be exact-and-consistent against the real underlying figures or
      a genuine minor discrepancy. Do NOT treat as a confirmed conflict
      without checking the Data Room's unrounded model.
