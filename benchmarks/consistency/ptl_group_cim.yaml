    period: {year: null, kind: null, period_label: "Trailing 5 Year Average"}
    operands:
      - {attribute: ebitdaUsd, value: 2052}
      - {attribute: revenueUsd, value: 15295}
    derived: {attribute: ebitdaMarginPct, value: 0.134}
    expected: holds
    note: "2052 / 15295 = 13.42%, rounds to stated 13.4%"
  - id: r14
    rule: ebitda_margin_pct_from_ebitda_and_revenue
    period: {year: 2018, kind: P, period_label: "2018F"}
    operands:
      - {attribute: ebitdaUsd, value: 1959}
      - {attribute: revenueUsd, value: 17146}
    derived: {attribute: ebitdaMarginPct, value: 0.114}
    expected: holds
    note: "1959 / 17146 = 11.42%, rounds to stated 11.4%"
  - id: r15
    rule: ebitda_margin_pct_from_ebitda_and_revenue
