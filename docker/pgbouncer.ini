[databases]
; Forward all database connections to the DigitalOcean cluster.
; TODO: Replace DO_CLUSTER_HOST and DB_NAME with your actual DigitalOcean cluster values.
; The host/port here is the private network endpoint of your DO managed database.
* = host=db-pgsql-tor1-13122-do-user-38781341-0.m.db.ondigitalocean.com port=25060 dbname=simpero

[pgbouncer]
listen_port = 5432
listen_addr = 0.0.0.0
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Transaction pooling mode is REQUIRED for SET LOCAL tenant context to work correctly.
; In session mode, backend connections persist across transactions and SET LOCAL would
; bleed across client sessions. In transaction mode, a backend connection is assigned
; per-transaction only, so SET LOCAL is automatically reset when the transaction ends.
pool_mode = transaction

max_client_conn = 22
default_pool_size = 20

; server_reset_query MUST be empty in transaction pooling mode.
; PgBouncer does not run a reset query between transactions (only between sessions),
; so setting it to DISCARD ALL here would have no effect but signals misconfiguration.
server_reset_query =

; TLS for backend connections to DigitalOcean managed Postgres (required).
server_tls_sslmode = require

; Log connections for debugging; reduce to 0 in production.
log_connections = 1
log_disconnections = 1
