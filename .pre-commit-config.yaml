# Runs the same ruff checks CI's "Lint (ruff)" job runs (.github/workflows/ci.yml),
# so a commit never lands unformatted and then fails CI on `ruff format --check`.
#
# Deliberately `language: system` + `uv run ruff ...` rather than the
# ruff-pre-commit mirror repo: this way ruff's version is the one pinned in
# pyproject.toml/uv.lock (single source of truth), not a second, possibly
# different pinned version pre-commit would otherwise manage itself.
#
# One-time setup per clone: `uv run pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix
        language: system
        types: [python]
